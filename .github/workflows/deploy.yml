name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Unit Tests & Coverage
        run: npm run coverage

      - name: Run Build
        run: npm run build

  dispatch-submodule:
    name: Dispatch submodule update
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify beercall-app
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SUBMODULE_DISPATCH_TOKEN }}
          repository: BeerCall/beercall-app
          event-type: submodule-updated
          client-payload: '{"repository":"beercall-frontend","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}'
