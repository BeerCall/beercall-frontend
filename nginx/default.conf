# Configuration du serveur statique Nginx pour BeerCall Frontend (SPA / PWA)
# Conforme aux exigences T14 et REV-07 :
# - Cache explicite : immutable pour assets hashés, no-cache pour entrypoints / manifestes / SW
# - Précompression gzip_static déterministe (sans double compression à la volée)
# - Refus direct des URLs .gz (404 no-store)
# - 404 text/plain no-store sur asset absent (jamais de fallback index.html)
# - Fallback SPA réservé exclusivement aux routes sans extension d'asset

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Inclusion des types MIME standards et déclaration webmanifest
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Désactivation de la compression à la volée (utilise uniquement gzip_static postbuild)
    gzip off;

    # Gestion globale des erreurs 404 : text/plain, no-store, jamais de HTML/index
    error_page 404 = @not_found;

    location @not_found {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Not Found\n";
    }

    # 1. Interdiction stricte de tout accès direct aux fichiers .gz
    location ~* \.gz$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Not Found\n";
    }

    # 2. Endpoints exacts revalidés : Cache-Control no-cache, jamais immutable
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /animations/manifest.json {
        gzip_static on;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        gzip_static on;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        gzip_static on;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    # 3. Packs d'animation versionnés par SHA-256 : immutable + gzip_static
    location ^~ /animations/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;

        location ~* \.gz$ {
            types { }
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 404 "Not Found\n";
        }

        try_files $uri =404;
    }

    # 4. Assets hashés par Vite : immutable + gzip_static
    location ^~ /assets/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;

        location ~* \.gz$ {
            types { }
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 404 "Not Found\n";
        }

        try_files $uri =404;
    }

    # 5. Suffixes d'assets statiques racine (icônes, etc.) : 404 si absents (pas de fallback SPA)
    location ~* \.(?:js|mjs|cjs|css|json|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot|fbx|webmanifest)$ {
        gzip_static on;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    # 6. Fallback SPA réservé exclusivement aux routes sans extension d'asset
    location / {
        try_files $uri $uri/ /index.html;
    }
}
